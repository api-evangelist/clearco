name: Clearco
description: 'Clearco is a fintech company providing non-dilutive, revenue-based capital
  to direct-to-consumer ecommerce and SaaS businesses, having deployed over $3 billion
  across more than 10,000 funded companies. Its funding products include Fixed Funding
  Capacity, Rolling Funding Capacity, Cash Advance, and Invoice Funding, with capped
  weekly payments and funding decisions within 24 hours. Clearco connects to a founder''s
  existing commerce and payments stack (Amazon, Shopify, Stripe, PayPal, Square, BigCommerce)
  to underwrite revenue, rather than exposing a public developer API. This profile was
  surfaced as a portfolio company of Emergence Capital and the SoftBank Vision Fund and
  enriched by the API Evangelist pipeline; no public API, developer portal, SDKs, or
  webhook surface is currently published.'
